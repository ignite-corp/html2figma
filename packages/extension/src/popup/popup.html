<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html2figma</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        width: 300px;
        margin: 0;
        padding: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        color: #1a1a2e;
        background: #f4f4f9;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        background: white;
        border-bottom: 1px solid #ebebf2;
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(140deg, #4c5bff 0%, #818cff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: -0.5px;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(76,91,255,0.3);
      }
      .header-copy h1 {
        font-size: 13px;
        font-weight: 700;
        margin: 0;
        color: #111;
      }
      .header-copy p {
        font-size: 11px;
        color: #aaa;
        margin: 2px 0 0;
      }

      /* ── Plan pill ── */
      .plan-pill {
        margin-left: auto;
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 999px;
        background: #eef0ff;
        color: #4c5bff;
        white-space: nowrap;
      }
      .plan-pill.pro { background: #e9f9f0; color: #1e9e5a; }
      .plan-pill.empty { background: #fdeeee; color: #e74c3c; }

      /* ── Content ── */
      .content {
        padding: 14px 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ── Card ── */
      .card {
        background: white;
        border-radius: 12px;
        border: 1px solid #eaeaf2;
        padding: 14px;
      }

      /* ── Code input ── */
      .code-label {
        font-size: 11px;
        font-weight: 600;
        color: #888;
        margin-bottom: 8px;
      }
      #code {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #e0e0ee;
        border-radius: 9px;
        font-family: ui-monospace, 'Courier New', monospace;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 8px;
        text-align: center;
        text-indent: 8px; /* letter-spacing 보정 */
        color: #4c5bff;
        background: #fafafe;
        outline: none;
        transition: border-color 0.15s;
        text-transform: uppercase;
      }
      #code:focus { border-color: #4c5bff; background: white; }
      #code::placeholder { color: #ccc; font-size: 13px; letter-spacing: 3px; text-indent: 3px; font-weight: 400; }
      .code-hint {
        font-size: 11px;
        color: #bbb;
        margin-top: 7px;
        line-height: 1.4;
      }

      /* ── Capture button ── */
      .btn-capture {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: #4c5bff;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-capture:hover:not(:disabled) { opacity: 0.88; }
      .btn-capture:disabled { opacity: 0.4; cursor: default; }

      /* ── Progress ── */
      .progress-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bar {
        height: 4px;
        background: #ebebf2;
        border-radius: 2px;
        overflow: hidden;
      }
      .bar > span {
        display: block;
        height: 100%;
        width: 0;
        background: #4c5bff;
        border-radius: 2px;
        transition: width 0.2s;
      }
      #status {
        font-size: 11px;
        color: #888;
        min-height: 14px;
      }
      #status.success { color: #27ae60; }
      #status.error   { color: #e74c3c; }

      /* ── Paywall ── */
      .paywall {
        background: linear-gradient(140deg, #f6f7ff 0%, #fdfdff 100%);
        border: 1px solid #dfe3ff;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
      }
      .paywall.hidden { display: none; }
      .paywall h2 {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 4px;
        color: #111;
      }
      .paywall p {
        font-size: 11px;
        color: #888;
        margin: 0 0 10px;
        line-height: 1.5;
      }
      .btn-upgrade {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(140deg, #4c5bff 0%, #818cff 100%);
        color: white;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-upgrade:hover:not(:disabled) { opacity: 0.9; }
      .btn-upgrade:disabled { opacity: 0.5; cursor: default; }
      .paywall-note {
        font-size: 10px;
        color: #aaa;
        margin-top: 8px;
      }
      .paywall-note a, .account-line a {
        color: #4c5bff;
        cursor: pointer;
        text-decoration: none;
      }

      /* ── Account ── */
      .account-line {
        font-size: 10px;
        color: #aaa;
        text-align: center;
        min-height: 13px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="logo">&lt;/&gt;</div>
      <div class="header-copy">
        <h1>html2figma</h1>
        <p>현재 페이지를 Figma로 캡처</p>
      </div>
      <span id="plan-pill" class="plan-pill" hidden></span>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Code card -->
      <div class="card">
        <div class="code-label">Figma 플러그인 코드</div>
        <input id="code" type="text" maxlength="6" placeholder="· · · · · ·" autocomplete="off" spellcheck="false" />
        <div class="code-hint">Figma 플러그인에서 <strong>연결하기</strong>를 누른 뒤<br>표시된 6자리 코드를 입력하세요</div>
      </div>

      <!-- Capture button -->
      <button id="capture" class="btn-capture" disabled>캡처하기</button>

      <!-- Progress -->
      <div class="progress-area">
        <div class="bar"><span id="progress"></span></div>
        <div id="status"></div>
      </div>

      <!-- Paywall (쿼터 소진 시 표시) -->
      <div id="paywall" class="paywall hidden">
        <h2>이번 달 무료 변환을 모두 사용했어요</h2>
        <p>Pro로 업그레이드하면 횟수 제한 없이<br>변환할 수 있어요.</p>
        <button id="upgrade" class="btn-upgrade">Pro 업그레이드 — 월 $9</button>
        <div class="paywall-note">이미 구독 중이신가요? <a id="signin-paywall">Google로 로그인</a></div>
      </div>

      <!-- Account -->
      <div id="account-line" class="account-line"></div>

    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>

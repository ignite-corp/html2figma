# html2figma 계정/구독 API.
#
# 배포 전 설정:
#   wrangler secret put FIGMA_CLIENT_SECRET   # Figma OAuth 앱 secret
#   wrangler secret put PADDLE_WEBHOOK_SECRET # Paddle 웹훅 서명 secret
#   wrangler secret put SESSION_SIGNING_KEY   # 세션/체크아웃 토큰 서명 키 (임의의 긴 랜덤 문자열)
# FIGMA_CLIENT_ID 는 공개값이므로 아래 [vars] 에 기입.
name = "html2figma-account"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

[vars]
FIGMA_CLIENT_ID = "REPLACE_WITH_FIGMA_CLIENT_ID"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "AccountDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO"]

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { font-family: Inter, -apple-system, sans-serif; font-size: 12px; margin: 0; padding: 16px; color: #333; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      .drop { border: 2px dashed #c9c9c9; border-radius: 8px; padding: 20px; text-align: center; color: #888; cursor: pointer; }
      .drop.over { border-color: #4c5bff; background: #f5f6ff; }
      textarea { width: 100%; height: 56px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; resize: vertical; }
      label.opt { display: flex; align-items: center; gap: 6px; margin: 8px 0; cursor: pointer; }
      button.primary { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: #4c5bff; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; }
      .bridge { margin-top: 12px; padding: 10px; border: 1px solid #eee; border-radius: 8px; background: #fafafa; }
      .bridge button { padding: 6px 10px; border: 1px solid #4c5bff; background: #fff; color: #4c5bff; border-radius: 6px; cursor: pointer; font-weight: 600; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #bbb; margin-right: 6px; }
      .dot.on { background: #2ecc71; }
      .code-box { margin-top: 10px; text-align: center; }
      .code-label { font-size: 11px; color: #888; }
      .code { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #2d3bd0; margin-top: 2px; }
      .bridge input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ddd; border-radius: 6px; margin-top: 6px; font-size: 12px; }
      .hidden { display: none; }
      #status { margin-top: 10px; min-height: 14px; color: #666; }
    </style>
  </head>
  <body>
    <h1>html2figma 임포트</h1>

    <div class="drop" id="drop">
      .h2f 파일을 드롭하거나 클릭해서 선택
      <input type="file" id="file" accept=".h2f,application/json" hidden />
    </div>

    <textarea id="paste" placeholder="또는 클립보드 내용(JSON)을 여기에 붙여넣기"></textarea>

    <label class="opt"><input type="checkbox" id="autolayout" /> Auto Layout 사용</label>
    <label class="opt"><input type="checkbox" id="styles" checked /> Local styles 생성</label>

    <button id="import" class="primary" disabled>임포트</button>

    <div class="bridge">
      <div><span class="dot" id="bridge-dot"></span><span id="bridge-status">Figma로 바로 받기: 연결 안 됨</span></div>
      <div id="code-box" class="code-box hidden">
        <div class="code-label">익스텐션에 이 코드를 입력하세요</div>
        <div class="code" id="code"></div>
      </div>
      <button id="bridge-connect" style="margin-top:8px;">연결 (코드 받기)</button>
    </div>

    <div id="status"></div>

    <!-- SCRIPT -->
  </body>
</html>

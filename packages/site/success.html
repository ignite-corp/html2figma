<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결제 완료 — html2figma Pro</title>
  <style>
    body { margin: 0; font-family: Inter, Pretendard, -apple-system, sans-serif; color: #1a1a2e; background: #fafafe; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #eef0f7; border-radius: 18px; padding: 40px 34px; max-width: 420px; width: calc(100% - 40px); text-align: center; }
    .check { font-size: 44px; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: #777; font-size: 13px; line-height: 1.7; margin: 0; }
    b { color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">🎉</div>
    <h1>Pro 구독이 시작됐어요</h1>
    <p>
      크롬 익스텐션 <b>팝업을 다시 열면</b> Pro가 자동으로 활성화됩니다.<br /><br />
      다른 기기에서는 익스텐션 팝업에서<br /><b>“Google로 로그인”</b>만 하면 바로 사용할 수 있어요.<br /><br />
      영수증은 결제 처리사(Paddle)가 이메일로 보내드립니다.
    </p>
  </div>
</body>
</html>

# Render 배포 설정 (git 연동, CLI 불필요 — VPN이 특정 CLI를 막아도 웹 대시보드로 배포 가능)
# https://render.com → New → Blueprint → 이 저장소 선택
#
# Render 기본 Node 이미지는 /usr/bin, /usr/lib/node_modules 가 읽기 전용(EROFS)이라
# corepack enable / npm install -g pnpm 이 모두 실패한다.
# → Docker 런타임으로 빌드해 컨테이너 안에서 pnpm(corepack)을 사용한다. (로컬 검증 완료)
services:
  - type: web
    name: html2figma-relay
    runtime: docker
    plan: free
    dockerfilePath: ./packages/bridge/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # 컨테이너가 PORT(기본 8080)로 바인딩 → Render 가 자동 매핑

# Render 배포 설정 (git 연동, CLI 불필요 — VPN이 특정 CLI를 막아도 웹 대시보드로 배포 가능)
# https://render.com → New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: html2figma-relay
    runtime: node
    plan: free
    # corepack enable 은 Render의 읽기전용 /usr/bin 에 심링크를 만들려다 실패(EROFS)하므로
    # pnpm 을 전역 설치해 사용한다.
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --no-frozen-lockfile && pnpm --filter @html2figma/shared build && pnpm --filter @html2figma/bridge build
    startCommand: node packages/bridge/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
    # Render 가 PORT 를 주입 → 서버가 process.env.PORT 로 바인딩함
